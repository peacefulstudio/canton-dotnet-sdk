name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (no leading v, e.g. 0.4.0-preview.4). Every job builds from the existing tag v<version>.'
        required: true
        type: string
      dry_run:
        description: 'Rehearsal: pack + attach to the draft, skip the nuget.org push, the GHCR push, the counter write-back and the release publish.'
        required: false
        type: boolean
        default: false
      codegen_cs_version:
        description: 'dry_run only: an already-published dpm-codegen-cs image version the DAR legs pull. Empty = <version>.'
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: release-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.r.outputs.version }}
      tag: ${{ steps.r.outputs.tag }}
      dry_run: ${{ steps.r.outputs.dry_run }}
      codegen_cs_version: ${{ steps.r.outputs.codegen_cs_version }}
      splice_version: ${{ steps.r.outputs.splice_version }}
      daml_finance_version: ${{ steps.r.outputs.daml_finance_version }}
      damlc_version: ${{ steps.r.outputs.damlc_version }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}
      - name: Resolve version + mode + source versions
        id: r
        env:
          VERSION_INPUT: ${{ inputs.version }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          CODEGEN_CS_INPUT: ${{ inputs.codegen_cs_version }}
        run: |
          set -euo pipefail
          if [ -n "${VERSION_INPUT:-}" ]; then
            VERSION="${VERSION_INPUT}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            echo "::error::no version input and not a tag"; exit 1
          fi
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${VERSION}' is not a release version"; exit 1
          fi
          PROPS_VERSION="$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -1 || true)"
          if [ "${PROPS_VERSION}" != "${VERSION}" ]; then
            echo "::error::tag v${VERSION} does not match <Version> ${PROPS_VERSION} in Directory.Build.props at the tagged commit"; exit 1
          fi
          .github/scripts/changelog-section.sh "${VERSION}" > /dev/null
          version_of() { awk -F': *' -v key="$1" '$1 == key { gsub(/["'"'"' ]/, "", $2); print $2 }' versions.yaml; }
          SPLICE="$(version_of splice)"
          FINANCE="$(version_of daml-finance)"
          DAMLC="$(version_of daml-sdk)"
          for pair in "splice=${SPLICE}" "daml-finance=${FINANCE}" "daml-sdk=${DAMLC}"; do
            [ -n "${pair#*=}" ] || { echo "::error::versions.yaml has no '${pair%%=*}' entry"; exit 1; }
          done
          DRY="${DRY_RUN_INPUT:-false}"
          CGV="${CODEGEN_CS_INPUT:-}"; [ -z "$CGV" ] && CGV="${VERSION}"
          [ "$DRY" = "true" ] || CGV="${VERSION}"
          {
            echo "version=${VERSION}"
            echo "tag=v${VERSION}"
            echo "dry_run=${DRY}"
            echo "codegen_cs_version=${CGV}"
            echo "splice_version=${SPLICE}"
            echo "daml_finance_version=${FINANCE}"
            echo "damlc_version=${DAMLC}"
          } >> "$GITHUB_OUTPUT"

  draft-bootstrap:
    needs: resolve
    permissions:
      contents: write
    uses: ./.github/workflows/_release-lifecycle.yaml
    with:
      action: bootstrap
      tag: ${{ needs.resolve.outputs.tag }}

  nuget-pack:
    needs: [resolve, draft-bootstrap]
    permissions:
      contents: write
    uses: ./.github/workflows/pack-nuget.yaml
    with:
      version: ${{ needs.resolve.outputs.version }}
      tag: ${{ needs.resolve.outputs.tag }}

  oci-build:
    needs: [resolve, draft-bootstrap]
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/build-oci-codegen-cs.yaml
    with:
      version: ${{ needs.resolve.outputs.version }}
      push: ${{ !fromJSON(needs.resolve.outputs.dry_run) }}

  splice-pack:
    needs: [resolve, nuget-pack, oci-build]
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/publish-splice.yaml
    with:
      splice_version: ${{ needs.resolve.outputs.splice_version }}
      damlc_version: ${{ needs.resolve.outputs.damlc_version }}
      codegen_cs_version: ${{ needs.resolve.outputs.codegen_cs_version }}
      release_tag: ${{ needs.resolve.outputs.tag }}
    secrets: inherit

  daml-finance-pack:
    needs: [resolve, nuget-pack, oci-build]
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/publish-daml-finance.yaml
    with:
      daml_finance_version: ${{ needs.resolve.outputs.daml_finance_version }}
      damlc_version: ${{ needs.resolve.outputs.damlc_version }}
      codegen_cs_version: ${{ needs.resolve.outputs.codegen_cs_version }}
      release_tag: ${{ needs.resolve.outputs.tag }}
    secrets: inherit

  nuget-publish:
    needs: [resolve, nuget-pack, oci-build, splice-pack, daml-finance-pack]
    if: ${{ !fromJSON(needs.resolve.outputs.dry_run) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yaml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
    secrets: inherit

  publish-release:
    needs: [resolve, nuget-publish]
    permissions:
      contents: write
    uses: ./.github/workflows/_release-lifecycle.yaml
    with:
      action: finalize
      tag: ${{ needs.resolve.outputs.tag }}

  complete:
    needs: [resolve, nuget-pack, oci-build, splice-pack, daml-finance-pack, nuget-publish, publish-release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Summarise release
        env:
          DRY: ${{ needs.resolve.outputs.dry_run }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          {
            echo "## Release ${TAG} (dry_run=${DRY})"
            echo ""
            echo "- nuget-pack: ${{ needs.nuget-pack.result }}"
            echo "- oci-build: ${{ needs.oci-build.result }}"
            echo "- splice-pack: ${{ needs.splice-pack.result }}"
            echo "- daml-finance-pack: ${{ needs.daml-finance-pack.result }}"
            echo "- nuget-publish: ${{ needs.nuget-publish.result }}"
            echo "- publish-release: ${{ needs.publish-release.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail unless every stage succeeded
        if: ${{ needs.resolve.outputs.dry_run != 'true' }}
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in ${RESULTS}; do
            [ "${result}" = "success" ] || { echo "::error::a release stage ended '${result}'"; exit 1; }
          done
