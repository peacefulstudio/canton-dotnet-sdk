name: Pack NuGet Packages (reusable)

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to pack (no leading v).'
        required: true
        type: string
      tag:
        description: 'Release tag to build from and attach the packages to (e.g. v0.4.0-preview.4).'
        required: true
        type: string
      codegen_cs_digest:
        description: 'Index digest (sha256:<hex>) of the dpm-codegen-cs bundle that Daml.Codegen.CSharp.MSBuild''s Dpm mode pins.'
        required: true
        type: string

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: dotnet build --configuration Release --no-restore -p:Version="$PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true
      - name: Test
        run: dotnet test --configuration Release --no-build
      - name: Pack
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          CODEGEN_CS_DIGEST: ${{ inputs.codegen_cs_digest }}
        run: |
          set -euo pipefail
          dotnet pack --configuration Release --no-build \
            -p:PackageVersion="$PACKAGE_VERSION" \
            -p:DamlCodegenBundleDigest="$CODEGEN_CS_DIGEST" \
            -p:ContinuousIntegrationBuild=true \
            -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg \
            -o "$GITHUB_WORKSPACE/output/nuget"
      - name: Require the bundle digest stamp in the MSBuild package
        run: |
          set -euo pipefail
          shopt -s nullglob
          stamp="build/Daml.Codegen.CSharp.MSBuild.BundleDigest.g.txt"
          packages=(output/nuget/Daml.Codegen.CSharp.MSBuild.*.nupkg)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::expected exactly one Daml.Codegen.CSharp.MSBuild package in output/nuget, found ${#packages[@]}"
            exit 1
          fi
          if ! unzip -l "${packages[0]}" "${stamp}" >/dev/null; then
            echo "::error::${packages[0]} lacks ${stamp}; a release must not ship a package without the dpm-codegen-cs digest"
            exit 1
          fi
      - name: Upload packages as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages
          path: |
            output/nuget/*.nupkg
            output/nuget/*.snupkg
          if-no-files-found: error
          retention-days: 30
      - name: Verify the packed set and its dependency-first push order
        run: scripts/order-nuget-push.sh output/nuget
      - name: Attach packages to the draft release (upload only; never create/publish)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(output/nuget/*.nupkg output/nuget/*.snupkg)
          gh release upload "$TAG" "${files[@]}" --clobber
