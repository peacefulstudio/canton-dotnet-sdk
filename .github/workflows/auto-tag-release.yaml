name: Auto-tag release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: auto-tag-release
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Tag the green main commit and start the release
        run: |
          set -euo pipefail
          skip() { echo "::notice::$1"; exit 0; }

          main_tip="$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')"
          [ "${main_tip}" = "${HEAD_SHA}" ] || skip "${HEAD_SHA} is no longer the tip of main; a newer CI run decides"

          read_at_head() {
            gh api -H "Accept: application/vnd.github.raw+json" "repos/${GH_REPO}/contents/$1?ref=${HEAD_SHA}"
          }
          version="$(read_at_head Directory.Build.props | grep -oP '(?<=<Version>)[^<]+' | head -1 || true)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::'${version}' in Directory.Build.props is not a release version"; exit 1; }
          tag="v${version}"

          if gh api "repos/${GH_REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            skip "${tag} already exists"
          fi

          held="$(gh pr list --state open --label hold-release --json number --jq 'length')"
          [ "${held}" = "0" ] || skip "${held} open pull request(s) carry hold-release"

          changelog="$(read_at_head CHANGELOG.md)"
          grep -qF "## [${version}]" <<<"${changelog}" \
            || { echo "::error::CHANGELOG.md has no section for ${version}; refusing to tag"; exit 1; }

          gh api -X POST "repos/${GH_REPO}/git/refs" -f "ref=refs/tags/${tag}" -f "sha=${HEAD_SHA}" >/dev/null
          echo "Tagged ${HEAD_SHA} as ${tag}"

          # Workaround: a tag pushed with GITHUB_TOKEN does not trigger `push` workflows (GitHub Actions
          # behaviour for events created by GITHUB_TOKEN), so the release is dispatched explicitly.
          gh workflow run release.yaml --ref main -f "version=${version}"
