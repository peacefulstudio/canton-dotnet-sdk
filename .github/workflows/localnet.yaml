name: LocalNet

on:
  push:
    branches: [main]
  schedule:
    - cron: '43 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localnet-${{ github.ref }}
  cancel-in-progress: false

env:
  LOCALNET_REF: v0.8.4-1
  LOCALNET_GRPC_URL: http://localhost:11901
  LOCALNET_JSON_API_URL: http://localhost:11975
  LOCALNET_KEYCLOAK_RELAY_URL: http://localhost:18082
  LOCALNET_TOKEN_URL: http://localhost:18082/realms/AValidator1/protocol/openid-connect/token

jobs:
  windows-x64:
    name: Windows x64 over WSL2 LocalNet
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout canton-localnet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: peacefulstudio/canton-localnet
          ref: ${{ env.LOCALNET_REF }}
          path: canton-localnet
          persist-credentials: false

      - name: Size the WSL2 VM
        shell: pwsh
        run: |
          "[wsl2]`nmemory=13GB`nswap=8GB`n" | Set-Content -Path "$env:USERPROFILE\.wslconfig" -Encoding ascii
          Get-Content "$env:USERPROFILE\.wslconfig"

      - name: Setup WSL2 Ubuntu-24.04
        timeout-minutes: 10
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2

      - name: Install Docker in WSL2
        shell: wsl-bash {0}
        run: |
          set -euxo pipefail
          curl -fsSL https://get.docker.com | sh
          for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
          docker version --format '{{.Server.Os}}/{{.Server.Arch}} {{.Server.Version}}'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: canton-localnet/cli/go.sum

      - name: Cross-build the canton-localnet CLI for linux/amd64
        shell: bash
        working-directory: canton-localnet/cli
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -o ../canton-localnet-linux ./cmd/canton-localnet

      - name: Bring up LocalNet inside WSL2 (one retry on the splice bootstrap race)
        shell: wsl-bash {0}
        run: |
          set -uxo pipefail
          start=$(date +%s)
          git clone --quiet --depth 1 --branch "${{ env.LOCALNET_REF }}" https://github.com/peacefulstudio/canton-localnet.git ~/canton-localnet
          install -m 0755 "$(wslpath -u '${{ github.workspace }}')/canton-localnet/canton-localnet-linux" ~/canton-localnet/canton-localnet
          cd ~/canton-localnet
          printf 'schemaVersion: preview-1\nmodules:\n  obs: false\n  pqs: true\n' > canton-localnet.yaml
          if ! ./canton-localnet up; then
            echo "::warning::canton-localnet up failed on first attempt after $(( $(date +%s) - start ))s; tearing down with volumes and retrying once"
            ./canton-localnet down --volumes || echo "::warning::pre-retry teardown failed"
            sleep 30
            ./canton-localnet up || exit 1
          fi
          ./canton-localnet wait-ready --timeout 30m --interval 5s || exit 1
          echo "LocalNet ready after $(( $(date +%s) - start ))s"

      # Workaround: the WSL2 localhost relay on Windows intermittently drops 8082 (keycloak) and 5432
      # (postgres) while 11901/11975 stay reachable; socat listeners inside WSL2 on 18082 and 15432
      # give Windows a second path.
      - name: Relay keycloak and postgres from WSL2 on 18082 and 15432
        shell: wsl-bash {0}
        run: |
          set -euxo pipefail
          sudo apt-get install -y socat
          setsid nohup socat TCP-LISTEN:18082,fork,reuseaddr TCP:127.0.0.1:8082 >/tmp/socat-18082.log 2>&1 < /dev/null &
          setsid nohup socat TCP-LISTEN:15432,fork,reuseaddr TCP:127.0.0.1:5432 >/tmp/socat-15432.log 2>&1 < /dev/null &
          for i in $(seq 1 15); do
            curl -sS --fail --max-time 5 -o /dev/null http://127.0.0.1:18082/realms/AValidator1/.well-known/openid-configuration && exit 0
            sleep 2
          done
          cat /tmp/socat-18082.log
          exit 1

      - name: Reach the ledger and keycloak from Windows
        if: always()
        shell: pwsh
        run: |
          foreach ($port in 11901, 11975, 5432, 15432, 8082, 18082) {
            $reached = $false
            foreach ($attempt in 1..6) {
              $probe = Test-NetConnection -ComputerName localhost -Port $port -WarningAction SilentlyContinue
              if ($probe.TcpTestSucceeded) { $reached = $true; break }
              Start-Sleep -Seconds 5
            }
            "localhost:$port reached=$reached after $attempt attempt(s)"
          }
          foreach ($base in "http://localhost:8082", $env:LOCALNET_KEYCLOAK_RELAY_URL) {
            try {
              $direct = Invoke-RestMethod -Uri "$base/realms/AValidator1/.well-known/openid-configuration" -TimeoutSec 15
              "$base issuer=$($direct.issuer)"
            } catch { "$base discovery failed: $($_.Exception.Message)" }
          }
          try {
            $version = Invoke-RestMethod -Uri "$env:LOCALNET_JSON_API_URL/v2/version" -TimeoutSec 15
            "participant version=$($version.version)"
          } catch { "participant version failed: $($_.Exception.Message)" }

      - name: Read validator OAuth2 client credentials from LocalNet fixtures
        shell: bash
        run: |
          set -euo pipefail
          oauth2_env="$(cygpath -u "${GITHUB_WORKSPACE}")/canton-localnet/compose/modules/keycloak/env/a-validator-1/on/oauth2.env"
          read_fixture_value() {
            value="$(tr -d '\r' < "${oauth2_env}" | grep -m 1 -oP "^${1}=\K\S+")" \
              || { echo "::error::${1} not found in ${oauth2_env}" >&2; return 1; }
            value="${value%\"}"
            printf '%s' "${value#\"}"
          }
          client_id="$(read_fixture_value AUTH_A_VALIDATOR_1_VALIDATOR_CLIENT_ID)"
          client_secret="$(read_fixture_value AUTH_A_VALIDATOR_1_VALIDATOR_CLIENT_SECRET)"
          echo "::add-mask::${client_secret}"
          {
            echo "LOCALNET_CLIENT_ID=${client_id}"
            echo "LOCALNET_CLIENT_SECRET=${client_secret}"
          } >> "${GITHUB_ENV}"

      - name: Read PQS connection string from LocalNet fixtures
        shell: bash
        run: |
          set -euo pipefail
          common_env="$(cygpath -u "${GITHUB_WORKSPACE}")/canton-localnet/compose/modules/localnet/env/common.env"
          raw="$(tr -d '\r' < "${common_env}" | grep -m 1 -oP '^DB_PASSWORD=\K\S+' || true)"
          [[ -n "${raw}" ]] || { echo "::error::DB_PASSWORD not found in ${common_env}" >&2; exit 1; }
          raw="${raw%\"}"
          raw="${raw#\"}"
          if [[ "${raw}" == "\${DB_PASSWORD:-"*"}" ]]; then
            compose_default_db_password="${raw#\$\{DB_PASSWORD:-}"
            compose_default_db_password="${compose_default_db_password%\}}"
            db_password="${DB_PASSWORD:-${compose_default_db_password}}"
          else
            db_password="${raw}"
          fi
          echo "::add-mask::${db_password}"
          pqs_conn="Host=localhost;Port=15432;Database=pqs-a-validator-1;Username=cnadmin;Password=${db_password}"
          echo "::add-mask::${pqs_conn}"
          echo "CANTON_LOCALNET_A_VALIDATOR_1_PQS_CONNECTION_STRING=${pqs_conn}" >> "${GITHUB_ENV}"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          for project in tests/Canton.Ledger.Grpc.Client.Integration.Tests/Canton.Ledger.Grpc.Client.Integration.Tests.csproj tests/Canton.Ledger.Rest.Client.Integration.Tests/Canton.Ledger.Rest.Client.Integration.Tests.csproj tests/Canton.Ledger.Client.Parity.Tests/Canton.Ledger.Client.Parity.Tests.csproj; do
            dotnet restore "${project}"
            dotnet build --configuration Release --no-restore "${project}"
          done

      - name: gRPC integration tests (including the PQS round trip)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          CANTON_LOCALNET_PROFILE: a-validator-1
          CANTON_LOCALNET_A_VALIDATOR_1_GRPC_URL: ${{ env.LOCALNET_GRPC_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_JSON_API_URL: ${{ env.LOCALNET_JSON_API_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_TOKEN_URL: ${{ env.LOCALNET_TOKEN_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_CLIENT_ID: ${{ env.LOCALNET_CLIENT_ID }}
          CANTON_LOCALNET_A_VALIDATOR_1_CLIENT_SECRET: ${{ env.LOCALNET_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          log="$(cygpath -u "${RUNNER_TEMP}")/grpc-integration.log"
          dotnet test --configuration Release --no-build \
            --project tests/Canton.Ledger.Grpc.Client.Integration.Tests/Canton.Ledger.Grpc.Client.Integration.Tests.csproj \
            -- --filter-trait "Category=Integration" \
            --output Detailed 2>&1 | tee "${log}"
          "$(cygpath -u "${GITHUB_WORKSPACE}")/.github/scripts/assert-tests-ran.sh" "${log}" "gRPC integration tests" 33 5

      - name: REST conformance tests (JSON Ledger API)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          CANTON_LOCALNET_PROFILE: a-validator-1
          CANTON_LOCALNET_A_VALIDATOR_1_GRPC_URL: ${{ env.LOCALNET_GRPC_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_JSON_API_URL: ${{ env.LOCALNET_JSON_API_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_TOKEN_URL: ${{ env.LOCALNET_TOKEN_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_CLIENT_ID: ${{ env.LOCALNET_CLIENT_ID }}
          CANTON_LOCALNET_A_VALIDATOR_1_CLIENT_SECRET: ${{ env.LOCALNET_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          log="$(cygpath -u "${RUNNER_TEMP}")/rest-conformance.log"
          dotnet test --configuration Release --no-build \
            --project tests/Canton.Ledger.Rest.Client.Integration.Tests/Canton.Ledger.Rest.Client.Integration.Tests.csproj \
            -- --filter-trait "Category=Integration" \
            --output Detailed 2>&1 | tee "${log}"
          "$(cygpath -u "${GITHUB_WORKSPACE}")/.github/scripts/assert-tests-ran.sh" "${log}" "REST conformance tests" 40 4

      - name: Cross-transport parity tests (Fake, gRPC, REST)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          CANTON_LOCALNET_PROFILE: a-validator-1
          CANTON_LOCALNET_A_VALIDATOR_1_GRPC_URL: ${{ env.LOCALNET_GRPC_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_JSON_API_URL: ${{ env.LOCALNET_JSON_API_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_TOKEN_URL: ${{ env.LOCALNET_TOKEN_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_CLIENT_ID: ${{ env.LOCALNET_CLIENT_ID }}
          CANTON_LOCALNET_A_VALIDATOR_1_CLIENT_SECRET: ${{ env.LOCALNET_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          log="$(cygpath -u "${RUNNER_TEMP}")/parity.log"
          dotnet test --configuration Release --no-build \
            --project tests/Canton.Ledger.Client.Parity.Tests/Canton.Ledger.Client.Parity.Tests.csproj \
            -- --filter-trait "Category=Integration" \
            --output Detailed 2>&1 | tee "${log}"
          "$(cygpath -u "${GITHUB_WORKSPACE}")/.github/scripts/assert-tests-ran.sh" "${log}" "Cross-transport parity tests" 209 0

  linux-x64:
    name: Linux x64 LocalNet
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LOCALNET_DIR: ${{ github.workspace }}/canton-localnet
      LOCALNET_LINUX_TOKEN_URL: http://localhost:8082/realms/AValidator1/protocol/openid-connect/token
      MEMORY_SAMPLES: ${{ github.workspace }}/memory-samples.txt
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout canton-localnet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: peacefulstudio/canton-localnet
          ref: ${{ env.LOCALNET_REF }}
          path: canton-localnet
          persist-credentials: false

      - name: Read validator OAuth2 client credentials from LocalNet fixtures
        run: |
          set -euo pipefail
          oauth2_env="${LOCALNET_DIR}/compose/modules/keycloak/env/a-validator-1/on/oauth2.env"
          read_fixture_value() {
            value="$(grep -m 1 -oP "^${1}=\K\S+" "${oauth2_env}")" \
              || { echo "::error::${1} not found in ${oauth2_env}" >&2; return 1; }
            value="${value%\"}"
            printf '%s' "${value#\"}"
          }
          client_id="$(read_fixture_value AUTH_A_VALIDATOR_1_VALIDATOR_CLIENT_ID)"
          client_secret="$(read_fixture_value AUTH_A_VALIDATOR_1_VALIDATOR_CLIENT_SECRET)"
          echo "::add-mask::${client_secret}"
          {
            echo "LOCALNET_CLIENT_ID=${client_id}"
            echo "LOCALNET_CLIENT_SECRET=${client_secret}"
          } >> "${GITHUB_ENV}"

      - name: Read PQS connection string from LocalNet fixtures
        run: |
          set -euo pipefail
          common_env="${LOCALNET_DIR}/compose/modules/localnet/env/common.env"
          raw="$(grep -m 1 -oP '^DB_PASSWORD=\K\S+' "${common_env}" || true)"
          [[ -n "${raw}" ]] || { echo "::error::DB_PASSWORD not found in ${common_env}" >&2; exit 1; }
          raw="${raw%\"}"
          raw="${raw#\"}"
          if [[ "${raw}" == "\${DB_PASSWORD:-"*"}" ]]; then
            compose_default_db_password="${raw#\$\{DB_PASSWORD:-}"
            compose_default_db_password="${compose_default_db_password%\}}"
            db_password="${DB_PASSWORD:-${compose_default_db_password}}"
          else
            db_password="${raw}"
          fi
          echo "::add-mask::${db_password}"
          pqs_conn="Host=localhost;Port=5432;Database=pqs-a-validator-1;Username=cnadmin;Password=${db_password}"
          echo "::add-mask::${pqs_conn}"
          echo "CANTON_LOCALNET_A_VALIDATOR_1_PQS_CONNECTION_STRING=${pqs_conn}" >> "${GITHUB_ENV}"
          echo "PQS_DB_PASSWORD=${db_password}" >> "${GITHUB_ENV}"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: canton-localnet/cli/go.sum

      - name: Build canton-localnet CLI
        working-directory: canton-localnet/cli
        run: |
          set -euo pipefail
          go build -o "${LOCALNET_DIR}/canton-localnet" ./cmd/canton-localnet

      - name: Build
        id: build
        run: |
          set -euo pipefail
          for project in tests/Canton.Ledger.Grpc.Client.Integration.Tests/Canton.Ledger.Grpc.Client.Integration.Tests.csproj tests/Canton.Ledger.Rest.Client.Integration.Tests/Canton.Ledger.Rest.Client.Integration.Tests.csproj tests/Canton.Ledger.Client.Parity.Tests/Canton.Ledger.Client.Parity.Tests.csproj; do
            dotnet restore "${project}"
            dotnet build --configuration Release --no-restore "${project}"
          done

      - name: Stop the build servers before LocalNet bring-up
        run: |
          set -euo pipefail
          dotnet build-server shutdown
          free -m

      - name: Start the memory sampler
        run: |
          set -euo pipefail
          nohup sh -c 'while true; do echo "$(date +%s) $(free -m | awk "/^Mem:/ {print \$3, \$7}")"; sleep 5; done' > "${MEMORY_SAMPLES}" 2>&1 &

      - name: Configure the single-synchronizer LocalNet
        working-directory: canton-localnet
        run: |
          set -euo pipefail
          printf 'schemaVersion: preview-1\nmodules:\n  obs: false\n  pqs: true\n' > canton-localnet.yaml

      - name: Bring up LocalNet (one retry on the splice bootstrap race)
        working-directory: canton-localnet
        run: |
          set -euo pipefail
          free -m
          if ! "${LOCALNET_DIR}/canton-localnet" up; then
            echo "::warning::canton-localnet up failed on first attempt, tearing down with volumes and retrying once"
            "${LOCALNET_DIR}/canton-localnet" down --volumes || echo "::warning::pre-retry teardown failed; second up may fail with leaked state"
            sleep 30
            "${LOCALNET_DIR}/canton-localnet" up
          fi

      - name: Wait for ledger readiness
        working-directory: canton-localnet
        run: |
          set -euo pipefail
          "${LOCALNET_DIR}/canton-localnet" wait-ready --timeout 30m --interval 5s

      - name: Wait for the PQS schema
        env:
          PGPASSWORD: ${{ env.PQS_DB_PASSWORD }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if psql -h localhost -p 5432 -U cnadmin -d pqs-a-validator-1 -tAc "select 1 from pg_proc where proname = 'active'" | grep -q 1; then
              echo "PQS schema ready"
              exit 0
            fi
            sleep 5
          done
          echo "::error::PQS active() function not created within 5 minutes"
          exit 1

      - name: Memory after bring-up
        run: |
          set -euo pipefail
          free -m
          docker stats --no-stream

      - name: gRPC integration tests (including the PQS round trip)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          CANTON_LOCALNET_PROFILE: a-validator-1
          CANTON_LOCALNET_A_VALIDATOR_1_GRPC_URL: ${{ env.LOCALNET_GRPC_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_JSON_API_URL: ${{ env.LOCALNET_JSON_API_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_TOKEN_URL: ${{ env.LOCALNET_LINUX_TOKEN_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_CLIENT_ID: ${{ env.LOCALNET_CLIENT_ID }}
          CANTON_LOCALNET_A_VALIDATOR_1_CLIENT_SECRET: ${{ env.LOCALNET_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/grpc-integration.log"
          dotnet test --configuration Release --no-build \
            --project tests/Canton.Ledger.Grpc.Client.Integration.Tests/Canton.Ledger.Grpc.Client.Integration.Tests.csproj \
            -- --filter-trait "Category=Integration" \
            --output Detailed 2>&1 | tee "${log}"
          "${GITHUB_WORKSPACE}/.github/scripts/assert-tests-ran.sh" "${log}" "gRPC integration tests" 33 3

      - name: REST conformance tests (JSON Ledger API)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          CANTON_LOCALNET_PROFILE: a-validator-1
          CANTON_LOCALNET_A_VALIDATOR_1_GRPC_URL: ${{ env.LOCALNET_GRPC_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_JSON_API_URL: ${{ env.LOCALNET_JSON_API_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_TOKEN_URL: ${{ env.LOCALNET_LINUX_TOKEN_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_CLIENT_ID: ${{ env.LOCALNET_CLIENT_ID }}
          CANTON_LOCALNET_A_VALIDATOR_1_CLIENT_SECRET: ${{ env.LOCALNET_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/rest-conformance.log"
          dotnet test --configuration Release --no-build \
            --project tests/Canton.Ledger.Rest.Client.Integration.Tests/Canton.Ledger.Rest.Client.Integration.Tests.csproj \
            -- --filter-trait "Category=Integration" \
            --output Detailed 2>&1 | tee "${log}"
          "${GITHUB_WORKSPACE}/.github/scripts/assert-tests-ran.sh" "${log}" "REST conformance tests" 40 2

      - name: Cross-transport parity tests (Fake, gRPC, REST)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          CANTON_LOCALNET_PROFILE: a-validator-1
          CANTON_LOCALNET_A_VALIDATOR_1_GRPC_URL: ${{ env.LOCALNET_GRPC_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_JSON_API_URL: ${{ env.LOCALNET_JSON_API_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_TOKEN_URL: ${{ env.LOCALNET_LINUX_TOKEN_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_CLIENT_ID: ${{ env.LOCALNET_CLIENT_ID }}
          CANTON_LOCALNET_A_VALIDATOR_1_CLIENT_SECRET: ${{ env.LOCALNET_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/parity.log"
          dotnet test --configuration Release --no-build \
            --project tests/Canton.Ledger.Client.Parity.Tests/Canton.Ledger.Client.Parity.Tests.csproj \
            -- --filter-trait "Category=Integration" \
            --output Detailed 2>&1 | tee "${log}"
          "${GITHUB_WORKSPACE}/.github/scripts/assert-tests-ran.sh" "${log}" "Cross-transport parity tests" 209 0

      - name: Memory after tests
        if: always()
        run: |
          set -euo pipefail
          free -m
          docker stats --no-stream || true
          {
            echo "## LocalNet lane memory"
            if [ -s "${MEMORY_SAMPLES}" ]; then
              sort -k2 -n -r "${MEMORY_SAMPLES}" | head -1 | awk '{print "Peak used: " $2 " MiB, available at that sample: " $3 " MiB"}'
              sort -k3 -n "${MEMORY_SAMPLES}" | head -1 | awk '{print "Lowest available: " $3 " MiB"}'
            fi
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Capture LocalNet state on failure
        if: failure()
        working-directory: canton-localnet
        run: |
          set -euo pipefail
          free -m > /tmp/free.txt 2>&1 || true
          docker stats --no-stream > /tmp/docker-stats.txt 2>&1 || true
          make status > /tmp/localnet-status.txt 2>&1 || true
          timeout 30 make logs > /tmp/localnet-logs.txt 2>&1 || true
          docker ps -a > /tmp/docker-ps.txt 2>&1 || true
          cp "${MEMORY_SAMPLES}" /tmp/memory-samples.txt || true
          dmesg 2>/dev/null | grep -i "out of memory\|oom" > /tmp/oom.txt || true

      - name: Upload LocalNet diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localnet-linux-diagnostics
          path: |
            /tmp/free.txt
            /tmp/docker-stats.txt
            /tmp/localnet-status.txt
            /tmp/localnet-logs.txt
            /tmp/docker-ps.txt
            /tmp/memory-samples.txt
            /tmp/oom.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down LocalNet
        if: always()
        working-directory: canton-localnet
        run: |
          set -euo pipefail
          "${LOCALNET_DIR}/canton-localnet" down --volumes || echo "::warning::teardown failed"
