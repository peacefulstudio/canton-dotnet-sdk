name: Publish NuGet Packages (reusable)

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag the packages were built from (e.g. v0.4.0-preview.4).'
        required: true
        type: string
    secrets:
      NUGET_USER:
        description: 'nuget.org username for OIDC trusted publishing (NuGet/login).'
        required: true
      RELEASE_COUNTERS_TOKEN:
        description: 'Token with Variables: read & write on this repo (persists the release-counter stores).'
        required: true

env:
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}
      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'
      - name: Download core packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: output/nuget/core
      - name: Download Splice packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Splice-nuget
          path: output/nuget/splice
      - name: Download Daml.Finance packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: DamlFinance-nuget
          path: output/nuget/finance
      - name: Download release-counter snapshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-counters-snapshot-*
          path: output/counters
      - name: Verify the core set and its dependency-first push order
        run: scripts/order-nuget-push.sh output/nuget/core
      - name: NuGet login (OIDC -> short-lived key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push core packages in dependency order
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: scripts/order-nuget-push.sh output/nuget/core --push "$NUGET_SOURCE"
      - name: Push Splice packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          NUPKG_DIR: output/nuget/splice
          COUNTER_VARIABLE_NAME: SPLICE_RELEASE_COUNTERS
        run: .github/scripts/push-packages.sh
      - name: Push Daml.Finance packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          NUPKG_DIR: output/nuget/finance
          COUNTER_VARIABLE_NAME: DAML_FINANCE_RELEASE_COUNTERS
        run: .github/scripts/push-packages.sh
      - name: Persist Splice release-counter store
        env:
          GH_TOKEN: ${{ secrets.RELEASE_COUNTERS_TOKEN }}
          COUNTERS_PATH: output/counters/release-counters-snapshot-Splice/release-counters.json
          COUNTER_VARIABLE_NAME: SPLICE_RELEASE_COUNTERS
        run: .github/scripts/persist-counters.sh
      - name: Persist Daml.Finance release-counter store
        env:
          GH_TOKEN: ${{ secrets.RELEASE_COUNTERS_TOKEN }}
          COUNTERS_PATH: output/counters/release-counters-snapshot-DamlFinance/release-counters.json
          COUNTER_VARIABLE_NAME: DAML_FINANCE_RELEASE_COUNTERS
        run: .github/scripts/persist-counters.sh
