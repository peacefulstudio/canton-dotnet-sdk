name: Build codegen-cs OCI artifact

on:
  workflow_call:
    inputs:
      version:
        description: 'Artifact version tag (e.g. 1.0.0). Required when called from another workflow.'
        required: true
        type: string
      push:
        description: 'When true, push per-RID artifacts + multi-arch index to GHCR. When false, build and smoke-test only.'
        required: false
        type: boolean
        default: true
    outputs:
      reference:
        description: 'Final multi-arch OCI reference pushed (empty when push=false).'
        value: ${{ jobs.compose-index.outputs.reference }}
      index_digest:
        description: 'Digest of the multi-arch index pushed (empty when push=false).'
        value: ${{ jobs.compose-index.outputs.index_digest }}
  workflow_dispatch:
    inputs:
      version:
        description: 'Artifact version tag (e.g. 1.0.0).'
        required: true
        type: string
      push:
        description: 'Push to GHCR. Uncheck to dry-run the build + smoke test without publishing.'
        required: false
        type: boolean
        default: true

concurrency:
  group: build-oci-codegen-cs-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: peacefulstudio/dpm-codegen-cs
  ORAS_VERSION: '1.3.1'
  JAVA_VERSION: '17'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ARTIFACT_TYPE: application/vnd.peacefulstudio.dpm-codegen-cs.bundle.v1+json

jobs:
  validate-inputs:
    name: Validate version tag
    if: ${{ vars.OCI_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      push: ${{ steps.resolve.outputs.push }}
      should_build: ${{ steps.resolve.outputs.should_build }}
    env:
      VERSION_INPUT: ${{ inputs.version }}
      PUSH_INPUT: ${{ inputs.push }}
    steps:
      - name: Resolve and validate version
        id: resolve
        run: |
          set -euo pipefail
          if [ -n "${VERSION_INPUT}" ]; then
            RESOLVED="${VERSION_INPUT}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RESOLVED="${GITHUB_REF_NAME#v}"
          else
            echo "::warning::no version input or tag — nothing to build, skipping"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "${RESOLVED}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::warning::version='${RESOLVED}' is not a release version (MAJOR.MINOR.PATCH[.REV][-prerelease]); skipping build"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PUSH="${PUSH_INPUT:-true}"
          echo "Version tag accepted: ${RESOLVED} (push=${PUSH})"
          echo "version=${RESOLVED}" >> "$GITHUB_OUTPUT"
          echo "push=${PUSH}" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"

  build-jvm-helper:
    name: Build JVM helper JAR
    needs: validate-inputs
    if: needs.validate-inputs.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup sbt
        uses: sbt/setup-sbt@af116cce31c00823d3903ce687f9cda3a4f19f1b # v1.2.1

      - name: Cache sbt
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier/cache
          key: sbt-${{ runner.os }}-${{ hashFiles('jvm-helper/build.sbt', 'jvm-helper/project/**') }}

      - name: Assemble JAR
        working-directory: jvm-helper
        env:
          DAML_DAR_TO_PROTO_VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: sbt 'clean; assembly'

      - name: Verify assembled jar reports the resolved version
        working-directory: jvm-helper
        env:
          RESOLVED_VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          REPORTED="$(java -jar target/scala-2.13/daml-dar-to-proto.jar --version)"
          if [ "${REPORTED}" != "${RESOLVED_VERSION}" ]; then
            echo "::error::assembled jar reports version '${REPORTED}', expected '${RESOLVED_VERSION}' — the DAML_DAR_TO_PROTO_VERSION injection is broken"
            exit 1
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jvm-helper-jar
          path: jvm-helper/target/scala-2.13/daml-dar-to-proto.jar
          retention-days: 1
          if-no-files-found: error

  build-intermediate-fixtures:
    name: Build intermediate DAR fixtures
    needs: [validate-inputs, build-jvm-helper]
    if: needs.validate-inputs.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION_INPUT: ${{ needs.validate-inputs.outputs.version }}
      PINNED_RICHTYPES_INTERMEDIATE_SHA256: '103ad17b448c6870889781f484daac1757167ea2c4cc186a560dc61e823782a4'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download JVM helper JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jvm-helper-jar
          path: jvm-helper-artifact

      - name: Install buf 1.73.0 from GitHub release (sha256-pinned; converts binpb to canonical JSON from a bare .proto with no codegen step)
        env:
          BUF_VERSION: '1.73.0'
          BUF_SHA256: '8f2986298ad08f0cc1bf999b9797b7c383adf32d7edf0f73d6f1e1a701baeac1'
        run: |
          set -euo pipefail
          BIN="${RUNNER_TEMP}/buf"
          curl -fsSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64" -o "${BIN}"
          echo "${BUF_SHA256}  ${BIN}" | sha256sum -c -
          chmod +x "${BIN}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Assert richtypes.dar full-decode matches the internal twin's determinism oracle (tests/determinism/shas/intermediate.sha256)
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/richtypes-full-decode.binpb"
          java -jar jvm-helper-artifact/daml-dar-to-proto.jar \
            --dar conformance/richtypes/richtypes.dar --out "${OUT}"
          ACTUAL="$(sha256sum "${OUT}" | awk '{print $1}')"
          if [ "${ACTUAL}" != "${PINNED_RICHTYPES_INTERMEDIATE_SHA256}" ]; then
            echo "::error::richtypes.dar full-decode sha256 (${ACTUAL}) does not match the internal twin's pinned tests/determinism/shas/intermediate.sha256 (${PINNED_RICHTYPES_INTERMEDIATE_SHA256}) — the public jar's IntermediateDar output has drifted from the determinism oracle."
            exit 1
          fi
          echo "richtypes.dar full-decode matches the pinned determinism oracle: ${ACTUAL}"

      - name: Decode every corpus DAR (--schema-only) and convert to canonical JSON
        run: |
          set -euo pipefail
          mkdir -p fixtures
          : > "${RUNNER_TEMP}/manifest-entries.jsonl"

          mapfile -t dars < <(find conformance -name '*.dar' | LC_ALL=C sort)
          expected_dars=4
          if [ "${#dars[@]}" -ne "${expected_dars}" ]; then
            echo "::error::expected ${expected_dars} corpus DAR(s) under conformance/, found ${#dars[@]} — a new/removed corpus DAR needs this count updated deliberately, not silently."
            printf '  found: %s\n' "${dars[@]:-<none>}"
            exit 1
          fi

          for dar in "${dars[@]}"; do
            name="$(basename "${dar}" .dar)"
            java -jar jvm-helper-artifact/daml-dar-to-proto.jar \
              --schema-only --dar "${dar}" --out "fixtures/${name}.binpb"
            buf convert proto/intermediate_dar.proto \
              --type daml.codegen.intermediate.IntermediateDar \
              --from "fixtures/${name}.binpb#format=binpb" \
              --to "${RUNNER_TEMP}/${name}.raw.json#format=json"
            jq -S . "${RUNNER_TEMP}/${name}.raw.json" > "fixtures/${name}.json"
            rm "${RUNNER_TEMP}/${name}.raw.json"

            [ -s "fixtures/${name}.binpb" ] || { echo "::error::fixtures/${name}.binpb is empty"; exit 1; }
            [ -s "fixtures/${name}.json" ] || { echo "::error::fixtures/${name}.json is empty"; exit 1; }

            jq -n -c \
              --arg name "${name}" \
              --arg dar "${dar}" \
              --arg darSha256 "$(sha256sum "${dar}" | awk '{print $1}')" \
              --arg binpb "${name}.binpb" \
              --arg binpbSha256 "$(sha256sum "fixtures/${name}.binpb" | awk '{print $1}')" \
              --arg json "${name}.json" \
              --arg jsonSha256 "$(sha256sum "fixtures/${name}.json" | awk '{print $1}')" \
              '{name: $name, dar: $dar, darSha256: $darSha256, binpb: $binpb, binpbSha256: $binpbSha256, json: $json, jsonSha256: $jsonSha256}' \
              >> "${RUNNER_TEMP}/manifest-entries.jsonl"
          done

          jq -n \
            --arg version "${VERSION_INPUT}" \
            --slurpfile fixtures "${RUNNER_TEMP}/manifest-entries.jsonl" \
            '{version: $version, schemaOnly: true, fixtures: $fixtures}' \
            | jq -S . > fixtures/manifest.json

          find fixtures -type f | LC_ALL=C sort

      - name: Archive intermediate fixtures for release assets
        run: |
          set -euo pipefail
          tar -czf "intermediate-fixtures-${VERSION_INPUT}.tar.gz" -C fixtures .

      - name: Upload intermediate fixtures artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intermediate-fixtures
          path: intermediate-fixtures-*.tar.gz
          retention-days: 1
          if-no-files-found: error

  build-per-rid:
    name: Build bundle (${{ matrix.rid }})
    needs: [validate-inputs, build-jvm-helper]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: linux
            arch: amd64
            runner: ubuntu-latest
            exe: Daml.Codegen.CSharp.Cli
            entrypoint: dpm-codegen-cs
            manifest: component.posix.yaml
          - rid: linux-arm64
            os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            exe: Daml.Codegen.CSharp.Cli
            entrypoint: dpm-codegen-cs
            manifest: component.posix.yaml
          - rid: osx-arm64
            os: darwin
            arch: arm64
            runner: macos-15
            exe: Daml.Codegen.CSharp.Cli
            entrypoint: dpm-codegen-cs
            manifest: component.posix.yaml
          - rid: win-x64
            os: windows
            arch: amd64
            runner: windows-latest
            exe: Daml.Codegen.CSharp.Cli.exe
            entrypoint: dpm-codegen-cs.cmd
            manifest: component.windows.yaml

    env:
      VERSION_INPUT: ${{ needs.validate-inputs.outputs.version }}
      RID: ${{ matrix.rid }}
      BUNDLE_OS: ${{ matrix.os }}
      BUNDLE_ARCH: ${{ matrix.arch }}
      EXE_NAME: ${{ matrix.exe }}
      ENTRYPOINT_NAME: ${{ matrix.entrypoint }}
      MANIFEST_NAME: ${{ matrix.manifest }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup oras
        uses: oras-project/setup-oras@38de303aac69abb66f3e6255b7198bff35f323e3 # v2.0.0
        with:
          version: ${{ env.ORAS_VERSION }}

      - name: Download JVM helper JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jvm-helper-jar
          path: jvm-helper-artifact

      # workaround for grpc/grpc#38538 — bundled Grpc.Tools linux_arm64 protoc
      # segfaults (SIGSEGV, MSB6006 exit 139) on ubuntu-24.04-arm runners.
      # No released Grpc.Tools has the fix; override with the system protoc.
      - name: Install system protoc (linux-arm64 workaround for grpc/grpc#38538)
        if: matrix.rid == 'linux-arm64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          protoc --version
          echo "PROTOBUF_PROTOC=/usr/bin/protoc" >> "${GITHUB_ENV}"

      - name: Publish self-contained CLI
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/Daml.Codegen.CSharp.Cli \
            -c Release \
            -r "${RID}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -o "publish/${RID}"

      - name: Assemble bundle directory
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="bundle/${RID}"
          mkdir -p "${BUNDLE}/bin"
          cp "publish/${RID}/${EXE_NAME}" "${BUNDLE}/bin/${EXE_NAME}"
          cp jvm-helper-artifact/daml-dar-to-proto.jar "${BUNDLE}/bin/daml-dar-to-proto.jar"
          cp "scripts/bundle-entrypoint/${ENTRYPOINT_NAME}" "${BUNDLE}/${ENTRYPOINT_NAME}"
          cp "scripts/bundle-entrypoint/${MANIFEST_NAME}" "${BUNDLE}/component.yaml"
          if [ "${BUNDLE_OS}" != "windows" ]; then
            chmod +x "${BUNDLE}/${ENTRYPOINT_NAME}" "${BUNDLE}/bin/${EXE_NAME}"
          fi
          ls -la "${BUNDLE}" "${BUNDLE}/bin"

      - name: Archive bundle for release assets
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "dpm-codegen-cs-${VERSION_INPUT}-${BUNDLE_OS}-${BUNDLE_ARCH}.tar.gz" \
            -C "bundle/${RID}" .

      - name: Upload bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-${{ matrix.rid }}
          path: dpm-codegen-cs-*.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Smoke test bundle
        shell: bash
        env:
          FIXTURE_DAR: tests/Daml.Codegen.CSharp.Tests/Snapshots/splice-api-token-holding-v1/splice-api-token-holding-v1.dar
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/smoke-out"
          COUNTERS="${RUNNER_TEMP}/counters.json"
          rm -rf "${OUT}" "${COUNTERS}"
          mkdir -p "${OUT}"
          "./bundle/${RID}/${ENTRYPOINT_NAME}" --dar "${FIXTURE_DAR}" --out "${OUT}" \
            -- --release-counters "${COUNTERS}" --generate-project

          first_cs="$(find "${OUT}" -type f -name '*.cs' -print -quit)"
          if [ -z "${first_cs}" ]; then
            echo "::error::Smoke test produced no .cs files in ${OUT}"
            exit 1
          fi
          echo "Smoke test OK — first generated file: ${first_cs}"

          if [ ! -s "${COUNTERS}" ]; then
            echo "::error::--release-counters did not write a non-empty ${COUNTERS}"
            exit 1
          fi
          if ! jq -e 'type == "object"' "${COUNTERS}" > /dev/null; then
            echo "::error::release-counters file is not a valid JSON object: ${COUNTERS}"
            cat "${COUNTERS}" >&2
            exit 1
          fi
          if ! jq -e '.store_version == 1' "${COUNTERS}" > /dev/null; then
            echo "::error::expected release-counters store_version 1, got $(jq -c '.store_version' "${COUNTERS}")"
            jq . "${COUNTERS}" >&2
            exit 1
          fi
          if ! jq -e '.codegen_generations | type == "object"' "${COUNTERS}" > /dev/null; then
            echo "::error::expected codegen_generations to be an object, got $(jq -r '.codegen_generations | type' "${COUNTERS}")"
            jq . "${COUNTERS}" >&2
            exit 1
          fi
          if ! jq -e '.codegen_generations | length == 1' "${COUNTERS}" > /dev/null; then
            echo "::error::expected exactly one codegen-generation entry, got $(jq '.codegen_generations | length' "${COUNTERS}")"
            jq . "${COUNTERS}" >&2
            exit 1
          fi
          if ! jq -e '.codegen_generations | to_entries[0].value == 0' "${COUNTERS}" > /dev/null; then
            echo "::error::expected first-emission generation ordinal 0, got $(jq -c '.codegen_generations | to_entries[0].value' "${COUNTERS}")"
            jq . "${COUNTERS}" >&2
            exit 1
          fi
          echo "Release-counter OK — first emission recorded generation ordinal 0"

          csproj="$(find "${OUT}" -type f -name '*.csproj' -print -quit)"
          if [ -z "${csproj}" ]; then
            echo "::error::--generate-project produced no .csproj in ${OUT}"
            exit 1
          fi
          version="$(sed -n '/<Version>/{s:.*<Version>\(.*\)</Version>.*:\1:p;q;}' "${csproj}")"
          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.0$'; then
            echo "::error::expected 4-segment <Version> ending in .0, got '${version}' in ${csproj}"
            exit 1
          fi
          echo "Generated-project OK — ${csproj} <Version>${version}</Version>"

      - name: Login to GHCR
        if: needs.validate-inputs.outputs.push == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${GITHUB_TOKEN}" | oras login "${REGISTRY}" \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Push per-RID artifact
        if: needs.validate-inputs.outputs.push == 'true'
        id: push
        shell: bash
        env:
          COMPONENT_FILE_MEDIA_TYPE: application/vnd.component.file
        run: |
          set -euo pipefail
          REF="${REGISTRY}/${IMAGE}:${VERSION_INPUT}-${BUNDLE_OS}-${BUNDLE_ARCH}"
          pushd "bundle/${RID}" > /dev/null

          declare -a FILES=(
            "component.yaml:644"
            "${ENTRYPOINT_NAME}:755"
            "bin/${EXE_NAME}:755"
            "bin/daml-dar-to-proto.jar:644"
          )

          ANNOTATIONS_JSON="${RUNNER_TEMP}/oras-annotations-${RID}.json"
          jq -n \
            --arg title "dpm-codegen-cs" \
            --arg version "${VERSION_INPUT}" \
            --arg source "https://github.com/${GITHUB_REPOSITORY}" \
            --arg os "${BUNDLE_OS}" \
            --arg arch "${BUNDLE_ARCH}" \
            --arg entrypoint "${ENTRYPOINT_NAME}" \
            '{
              "$manifest": {
                "org.opencontainers.image.title": $title,
                "org.opencontainers.image.version": $version,
                "org.opencontainers.image.source": $source,
                "org.opencontainers.image.licenses": "Apache-2.0",
                "org.opencontainers.image.os": $os,
                "org.opencontainers.image.architecture": $arch,
                "studio.peaceful.dpm.os": $os,
                "studio.peaceful.dpm.arch": $arch,
                "studio.peaceful.dpm.entrypoint": $entrypoint
              }
            }' > "${ANNOTATIONS_JSON}"

          for entry in "${FILES[@]}"; do
            path="${entry%:*}"
            mode="${entry##*:}"
            if stat -f '%Sm' -t '%Y-%m-%dT%H:%M:%SZ' "${path}" > /dev/null 2>&1; then
              modtime_iso=$(stat -f '%Sm' -t '%Y-%m-%dT%H:%M:%SZ' "${path}")
            else
              modtime_iso=$(date -u -d "@$(stat -c '%Y' "${path}")" '+%Y-%m-%dT%H:%M:%SZ')
            fi
            tmp="${ANNOTATIONS_JSON}.tmp"
            jq \
              --arg path "${path}" \
              --arg mode "${mode}" \
              --arg modtime "${modtime_iso}" \
              '.[$path] = {
                "network.canton.dpm.file-mode": $mode,
                "network.canton.dpm.file-modtime": $modtime,
                "network.canton.dpm.file-name": $path,
                "com.digitalasset.file-mode": $mode,
                "com.digitalasset.file-modtime": $modtime,
                "com.digitalasset.file-name": $path
              }' \
              "${ANNOTATIONS_JSON}" > "${tmp}"
            mv "${tmp}" "${ANNOTATIONS_JSON}"
          done

          digest=$(oras push "${REF}" \
            --artifact-type "${ARTIFACT_TYPE}" \
            --annotation-file "${ANNOTATIONS_JSON}" \
            --format go-template='{{.digest}}' \
            "component.yaml:${COMPONENT_FILE_MEDIA_TYPE}" \
            "${ENTRYPOINT_NAME}:${COMPONENT_FILE_MEDIA_TYPE}" \
            "bin/${EXE_NAME}:${COMPONENT_FILE_MEDIA_TYPE}" \
            "bin/daml-dar-to-proto.jar:${COMPONENT_FILE_MEDIA_TYPE}")
          popd > /dev/null
          echo "ref=${REF}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Pushed ${REF} -> ${digest}"

      - name: Write per-RID manifest descriptor
        if: needs.validate-inputs.outputs.push == 'true'
        shell: bash
        env:
          REF: ${{ steps.push.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "manifest-descriptors"
          jq -n \
            --arg ref "${REF}" \
            --arg digest "${DIGEST}" \
            --arg os "${BUNDLE_OS}" \
            --arg arch "${BUNDLE_ARCH}" \
            '{ref: $ref, digest: $digest, os: $os, arch: $arch}' \
            > "manifest-descriptors/${BUNDLE_OS}-${BUNDLE_ARCH}.json"

      - name: Upload manifest descriptor artifact
        if: needs.validate-inputs.outputs.push == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifest-descriptor-${{ matrix.rid }}
          path: manifest-descriptors/*.json
          retention-days: 1
          if-no-files-found: error

  compose-index:
    name: Compose multi-arch index
    needs: [validate-inputs, build-per-rid]
    if: needs.validate-inputs.outputs.push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      reference: ${{ steps.compose.outputs.reference }}
      index_digest: ${{ steps.compose.outputs.index_digest }}

    env:
      VERSION_INPUT: ${{ needs.validate-inputs.outputs.version }}

    steps:
      - name: Setup oras
        uses: oras-project/setup-oras@38de303aac69abb66f3e6255b7198bff35f323e3 # v2.0.0
        with:
          version: ${{ env.ORAS_VERSION }}

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GITHUB_TOKEN}" | oras login "${REGISTRY}" \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Download all manifest descriptors
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: manifest-descriptor-*
          path: manifest-descriptors
          merge-multiple: true

      - name: Compose index
        id: compose
        run: |
          set -euo pipefail
          INDEX_REF="${REGISTRY}/${IMAGE}:${VERSION_INPUT}"
          INDEX_REPO="${REGISTRY}/${IMAGE}"
          per_rid_refs=()
          platforms_json='{}'
          for descriptor in manifest-descriptors/*.json; do
            ref=$(jq -r '.ref' "${descriptor}")
            digest=$(jq -r '.digest' "${descriptor}")
            os=$(jq -r '.os' "${descriptor}")
            arch=$(jq -r '.arch' "${descriptor}")
            per_rid_refs+=("${ref}@${digest}")
            platforms_json=$(jq -c \
              --arg digest "${digest}" \
              --arg os "${os}" \
              --arg arch "${arch}" \
              '.[$digest] = {os: $os, architecture: $arch}' \
              <<<"${platforms_json}")
          done
          expected_platforms=4
          if [ "${#per_rid_refs[@]}" -ne "${expected_platforms}" ]; then
            echo "::error::Expected ${expected_platforms} per-RID manifest descriptors, found ${#per_rid_refs[@]} — refusing to compose a partial index."
            exit 1
          fi
          echo "Composing index ${INDEX_REF} from ${#per_rid_refs[@]} per-RID manifests:"
          printf '  - %s\n' "${per_rid_refs[@]}"

          oras manifest index create \
            --artifact-type "${ARTIFACT_TYPE}" \
            --output index.raw.json \
            "${INDEX_REPO}" \
            "${per_rid_refs[@]}"

          jq \
            --argjson platforms "${platforms_json}" \
            '.manifests |= map(. + {platform: $platforms[.digest]})' \
            index.raw.json > index.json

          missing=$(jq -r '[.manifests[] | select((.platform.os // "" | . == "" or . == "null") or (.platform.architecture // "" | . == "" or . == "null"))] | length' index.json)
          if [ "${missing}" -ne 0 ]; then
            echo "::error::Index has ${missing} descriptor(s) with missing/empty platform fields after patching."
            jq . index.json
            exit 1
          fi

          digest=$(oras manifest push \
            --media-type application/vnd.oci.image.index.v1+json \
            --descriptor \
            "${INDEX_REF}" \
            index.json | jq -r '.digest')
          echo "reference=${INDEX_REF}" >> "${GITHUB_OUTPUT}"
          echo "index_digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Index pushed: ${INDEX_REF} -> ${digest}"

      - name: Summary
        env:
          REF: ${{ steps.compose.outputs.reference }}
          DIGEST: ${{ steps.compose.outputs.index_digest }}
        run: |
          set -euo pipefail
          {
            echo "## dpm-codegen-cs ${VERSION_INPUT}"
            echo ""
            echo "**Multi-arch index:** \`${REF}\`"
            echo ""
            echo "**Digest:** \`${DIGEST}\`"
            echo ""
            echo "### Per-RID manifests"
            echo ""
            echo "| OS / Arch | Reference |"
            echo "|-----------|-----------|"
            for descriptor in manifest-descriptors/*.json; do
              os=$(jq -r '.os' "${descriptor}")
              arch=$(jq -r '.arch' "${descriptor}")
              ref=$(jq -r '.ref' "${descriptor}")
              echo "| ${os}/${arch} | \`${ref}\` |"
            done
            echo ""
            echo "### GHCR package visibility"
            echo ""
            echo 'New GHCR packages default to **private**. After the first push of this artifact, an org admin must flip ghcr.io/peacefulstudio/dpm-codegen-cs to public via the GHCR package settings, otherwise unauthenticated dpm pulls will 404. This step is one-time per package.'
          } >> "${GITHUB_STEP_SUMMARY}"

  dpm-component-integration:
    name: Integration test (stock dpm pull)
    needs: [validate-inputs, compose-index]
    if: needs.validate-inputs.outputs.push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    env:
      VERSION_INPUT: ${{ needs.validate-inputs.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup JDK
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dpm 1.0.19 from GitHub release (oci:// component URIs need >= 1.0.12)
        env:
          DPM_VERSION: '1.0.19'
          DPM_SHA256: '36edd37025d6c1e8a72b5502234b6fea859be78950909733bc8a82bbb1c57798'
        run: |
          set -euo pipefail
          TARBALL="dpm-${DPM_VERSION}-linux-amd64.tar.gz"
          URL="https://github.com/digital-asset/dpm/releases/download/${DPM_VERSION}/${TARBALL}"
          STAGE="${RUNNER_TEMP}/dpm-install"
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}" "${HOME}/.dpm/bin"
          curl -fsSL "${URL}" -o "${STAGE}/${TARBALL}"
          echo "${DPM_SHA256}  ${STAGE}/${TARBALL}" | sha256sum -c -
          tar -xzf "${STAGE}/${TARBALL}" -C "${STAGE}"
          install -m 0755 "${STAGE}/dpm" "${HOME}/.dpm/bin/dpm"
          echo "${HOME}/.dpm/bin" >> "${GITHUB_PATH}"
          "${HOME}/.dpm/bin/dpm" --version

      - name: Build local runtime NuGet packs (local feed)
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack src/Daml.Runtime/Daml.Runtime.csproj -c Release
          dotnet pack src/Daml.Ledger.Abstractions/Daml.Ledger.Abstractions.csproj -c Release
          ls -l output/nuget/
          ls output/nuget/Daml.Runtime.*.nupkg >/dev/null 2>&1 \
            || { echo "::error::no Daml.Runtime pack under output/nuget/ — the fixture would silently skip"; exit 1; }
          ls output/nuget/Daml.Ledger.Abstractions.*.nupkg >/dev/null 2>&1 \
            || { echo "::error::no Daml.Ledger.Abstractions pack under output/nuget/ — the fixture would silently skip"; exit 1; }

      - name: Seed candidate pin and dpm wrapper
        shell: bash
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE: ${{ env.IMAGE }}
        run: |
          set -euo pipefail
          PIN_DIR="${RUNNER_TEMP}/dpm-pin"
          WRAPPER="${RUNNER_TEMP}/dpm-codegen-cs-wrapper.sh"
          rm -rf "${PIN_DIR}"
          mkdir -p "${PIN_DIR}"
          cat > "${PIN_DIR}/daml.yaml" <<EOF
          components:
            - "oci://${REGISTRY}/${IMAGE}:${VERSION_INPUT}"
          EOF
          cat > "${WRAPPER}" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          cd "${PIN_DIR}"
          exec dpm "\$@"
          EOF
          chmod +x "${WRAPPER}"
          echo "CODEGEN_CS_CMD=${WRAPPER}" >> "${GITHUB_ENV}"

      - name: Run published candidate codegen-cs → pack integration test (Test C)
        shell: bash
        env:
          CODEGEN_CS_BASE_ARGS: codegen-cs
          DPM_AUTO_INSTALL: 'true'
        run: |
          set -euo pipefail
          test -n "${CODEGEN_CS_CMD:-}" \
            || { echo "::error::CODEGEN_CS_CMD is unset — the candidate fixture would silently skip instead of testing the published artifact"; exit 1; }
          test -x "${CODEGEN_CS_CMD}" \
            || { echo "::error::CODEGEN_CS_CMD=${CODEGEN_CS_CMD} is not an executable wrapper"; exit 1; }
          dotnet test --project tests/Daml.Codegen.CSharp.Tests/Daml.Codegen.CSharp.Tests.csproj \
            -c Release \
            --filter-method "*generated_csproj_packs_into_nupkg_for_splice_holding_v1_fixture"

  attach-to-draft-release:
    name: Attach OCI bundles to draft release
    needs: [build-per-rid, compose-index]
    if: github.event_name == 'push' && github.ref_type == 'tag' && vars.OCI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download bundle artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundle-*
          merge-multiple: true
          path: bundles

      - name: Attach bundles to draft release (upload only; never create/publish)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if release_err=$(gh release view "$TAG" 2>&1 >/dev/null); then
            :
          elif printf '%s' "$release_err" | grep -qi 'release not found'; then
            echo "::notice::no draft release $TAG (orchestrator bootstrap should have created it); skipping attach"
            exit 0
          else
            echo "::error::gh release view $TAG failed for a reason other than not-found: $release_err"
            exit 1
          fi
          shopt -s nullglob
          files=(bundles/*.tar.gz)
          expected=4
          if [ "${#files[@]}" -ne "${expected}" ]; then
            echo "::error::expected ${expected} bundle tarball(s) under bundles/, found ${#files[@]} — the build-per-rid matrix legs are hard dependencies, so a mismatch means the download step or an upstream build broke."
            printf '  found: %s\n' "${files[@]:-<none>}"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  attach-standalone-assets-to-draft-release:
    name: Attach standalone dar-to-proto assets to draft release
    needs: [validate-inputs, build-jvm-helper, build-per-rid, build-intermediate-fixtures]
    if: github.event_name == 'push' && github.ref_type == 'tag' && vars.OCI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download JVM helper JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jvm-helper-jar
          path: jvm-helper-artifact

      - name: Download intermediate fixtures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: intermediate-fixtures
          path: intermediate-fixtures-artifact

      - name: Attach dar-to-proto jar + proto + intermediate fixtures + checksums to draft release (upload only; never create/publish)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESOLVED_VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if release_err=$(gh release view "$TAG" 2>&1 >/dev/null); then
            :
          elif printf '%s' "$release_err" | grep -qi 'release not found'; then
            echo "::notice::no draft release $TAG (orchestrator bootstrap should have created it); skipping attach"
            exit 0
          else
            echo "::error::gh release view $TAG failed for a reason other than not-found: $release_err"
            exit 1
          fi

          mkdir -p standalone-assets
          cp jvm-helper-artifact/daml-dar-to-proto.jar \
            "standalone-assets/daml-dar-to-proto-${RESOLVED_VERSION}.jar"
          cp proto/intermediate_dar.proto \
            "standalone-assets/intermediate_dar-${RESOLVED_VERSION}.proto"
          cp "intermediate-fixtures-artifact/intermediate-fixtures-${RESOLVED_VERSION}.tar.gz" \
            "standalone-assets/intermediate-fixtures-${RESOLVED_VERSION}.tar.gz"

          files=(
            "standalone-assets/daml-dar-to-proto-${RESOLVED_VERSION}.jar"
            "standalone-assets/intermediate_dar-${RESOLVED_VERSION}.proto"
            "standalone-assets/intermediate-fixtures-${RESOLVED_VERSION}.tar.gz"
          )
          for f in "${files[@]}"; do
            [ -s "$f" ] || { echo "::error::standalone asset $f is empty (0 bytes) — refusing to attach a corrupt artifact"; exit 1; }
          done

          (cd standalone-assets && sha256sum "$(basename "${files[0]}")" "$(basename "${files[1]}")" "$(basename "${files[2]}")" > SHA256SUMS)

          gh release upload "$TAG" "${files[@]}" standalone-assets/SHA256SUMS --clobber
