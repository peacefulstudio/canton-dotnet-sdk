name: Integration (multi-synchronizer)

on:
  workflow_dispatch:
  schedule:
    - cron: '47 4 * * 1'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: integration-multisync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration-multisync:
    name: integration (localnet, multi-synchronizer)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LOCALNET_DIR: ${{ github.workspace }}/canton-localnet
      LOCALNET_GRPC_URL: http://localhost:11901
      LOCALNET_JSON_API_URL: http://localhost:11975
      LOCALNET_TOKEN_URL: http://localhost:8082/realms/AValidator1/protocol/openid-connect/token
      MEMORY_SAMPLES: ${{ github.workspace }}/memory-samples.txt
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout canton-localnet v0.8.4-1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: peacefulstudio/canton-localnet
          ref: v0.8.4-1
          path: canton-localnet
          persist-credentials: false

      - name: Read validator OAuth2 client credentials from LocalNet fixtures
        run: |
          set -euo pipefail
          oauth2_env="${LOCALNET_DIR}/compose/modules/keycloak/env/a-validator-1/on/oauth2.env"
          read_fixture_value() {
            value="$(grep -m 1 -oP "^${1}=\K\S+" "${oauth2_env}")" \
              || { echo "::error::${1} not found in ${oauth2_env}" >&2; return 1; }
            value="${value%\"}"
            printf '%s' "${value#\"}"
          }
          client_id="$(read_fixture_value AUTH_A_VALIDATOR_1_VALIDATOR_CLIENT_ID)"
          client_secret="$(read_fixture_value AUTH_A_VALIDATOR_1_VALIDATOR_CLIENT_SECRET)"
          echo "::add-mask::${client_secret}"
          {
            echo "LOCALNET_CLIENT_ID=${client_id}"
            echo "LOCALNET_CLIENT_SECRET=${client_secret}"
          } >> "${GITHUB_ENV}"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: canton-localnet/cli/go.sum

      - name: Build canton-localnet CLI
        working-directory: canton-localnet/cli
        run: |
          set -euo pipefail
          go build -o "${LOCALNET_DIR}/canton-localnet" ./cmd/canton-localnet

      - name: Restore
        run: |
          set -euo pipefail
          dotnet restore tests/Canton.Ledger.Grpc.Client.Integration.Tests/Canton.Ledger.Grpc.Client.Integration.Tests.csproj
          dotnet restore tests/Canton.Ledger.Rest.Client.Integration.Tests/Canton.Ledger.Rest.Client.Integration.Tests.csproj
          dotnet restore tests/Canton.Ledger.Client.Parity.Tests/Canton.Ledger.Client.Parity.Tests.csproj

      - name: Build
        run: |
          set -euo pipefail
          dotnet build --configuration Release --no-restore \
            tests/Canton.Ledger.Grpc.Client.Integration.Tests/Canton.Ledger.Grpc.Client.Integration.Tests.csproj
          dotnet build --configuration Release --no-restore \
            tests/Canton.Ledger.Rest.Client.Integration.Tests/Canton.Ledger.Rest.Client.Integration.Tests.csproj
          dotnet build --configuration Release --no-restore \
            tests/Canton.Ledger.Client.Parity.Tests/Canton.Ledger.Client.Parity.Tests.csproj

      - name: Stop the build servers before LocalNet bring-up
        run: |
          set -euo pipefail
          dotnet build-server shutdown
          free -m

      - name: Start the memory sampler
        run: |
          set -euo pipefail
          nohup sh -c 'while true; do echo "$(date +%s) $(free -m | awk "/^Mem:/ {print \$3, \$7}")"; sleep 5; done' > "${MEMORY_SAMPLES}" 2>&1 &

      - name: Configure the multi-synchronizer topology
        working-directory: canton-localnet
        run: |
          set -euo pipefail
          cat > canton-localnet.yaml <<'YAML'
          schemaVersion: preview-1
          modules:
            obs: false
            pqs: false
          multiSync: true
          YAML

      - name: Bring up the multi-synchronizer LocalNet (one retry on the splice bootstrap race)
        working-directory: canton-localnet
        run: |
          set -euo pipefail
          free -m
          if ! "${LOCALNET_DIR}/canton-localnet" up --multi-sync; then
            echo "::warning::canton-localnet up failed on first attempt, tearing down with volumes and retrying once"
            "${LOCALNET_DIR}/canton-localnet" down --volumes || echo "::warning::pre-retry teardown failed; second up may fail with leaked state"
            sleep 30
            "${LOCALNET_DIR}/canton-localnet" up --multi-sync
          fi

      - name: Wait for ledger readiness on two synchronizers
        working-directory: canton-localnet
        run: |
          set -euo pipefail
          "${LOCALNET_DIR}/canton-localnet" wait-ready --synchronizers 2 --timeout 15m --interval 5s

      - name: Memory after bring-up
        run: |
          set -euo pipefail
          free -m
          docker stats --no-stream

      - name: gRPC reassignment conformance tests
        env:
          CANTON_LOCALNET_PROFILE: a-validator-1
          CANTON_LOCALNET_A_VALIDATOR_1_GRPC_URL: ${{ env.LOCALNET_GRPC_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_JSON_API_URL: ${{ env.LOCALNET_JSON_API_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_TOKEN_URL: ${{ env.LOCALNET_TOKEN_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_CLIENT_ID: ${{ env.LOCALNET_CLIENT_ID }}
          CANTON_LOCALNET_A_VALIDATOR_1_CLIENT_SECRET: ${{ env.LOCALNET_CLIENT_SECRET }}
          CANTON_REASSIGNMENT_REQUIRE_MULTI_SYNC: '1'
        run: |
          set -euo pipefail
          dotnet test --configuration Release --no-build \
            --project tests/Canton.Ledger.Grpc.Client.Integration.Tests/Canton.Ledger.Grpc.Client.Integration.Tests.csproj \
            -- --filter-class Canton.Ledger.Grpc.Client.Integration.Tests.ReassignmentInterfaceFilterConformanceTests \
            --minimum-expected-tests 3 \
            --output Detailed

      - name: REST reassignment conformance tests
        env:
          CANTON_LOCALNET_PROFILE: a-validator-1
          CANTON_LOCALNET_A_VALIDATOR_1_GRPC_URL: ${{ env.LOCALNET_GRPC_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_JSON_API_URL: ${{ env.LOCALNET_JSON_API_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_TOKEN_URL: ${{ env.LOCALNET_TOKEN_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_CLIENT_ID: ${{ env.LOCALNET_CLIENT_ID }}
          CANTON_LOCALNET_A_VALIDATOR_1_CLIENT_SECRET: ${{ env.LOCALNET_CLIENT_SECRET }}
          CANTON_REASSIGNMENT_REQUIRE_MULTI_SYNC: '1'
        run: |
          set -euo pipefail
          dotnet test --configuration Release --no-build \
            --project tests/Canton.Ledger.Rest.Client.Integration.Tests/Canton.Ledger.Rest.Client.Integration.Tests.csproj \
            -- --filter-class Canton.Ledger.Rest.Client.Integration.Tests.RestReassignmentConformanceTests \
            --minimum-expected-tests 2 \
            --output Detailed

      - name: Party allocation without a synchronizerId parity fact, gRPC and REST
        env:
          CANTON_LOCALNET_PROFILE: a-validator-1
          CANTON_LOCALNET_A_VALIDATOR_1_GRPC_URL: ${{ env.LOCALNET_GRPC_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_JSON_API_URL: ${{ env.LOCALNET_JSON_API_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_TOKEN_URL: ${{ env.LOCALNET_TOKEN_URL }}
          CANTON_LOCALNET_A_VALIDATOR_1_CLIENT_ID: ${{ env.LOCALNET_CLIENT_ID }}
          CANTON_LOCALNET_A_VALIDATOR_1_CLIENT_SECRET: ${{ env.LOCALNET_CLIENT_SECRET }}
          CANTON_REASSIGNMENT_REQUIRE_MULTI_SYNC: '1'
          PARITY_FACT: AllocatePartyAsync_without_a_synchronizerId_succeeds_on_a_single_synchronizer_participant_and_fails_on_a_multi_synchronizer_one
        run: |
          set -euo pipefail
          dotnet test --configuration Release --no-build \
            --project tests/Canton.Ledger.Client.Parity.Tests/Canton.Ledger.Client.Parity.Tests.csproj \
            -- --filter-method "Canton.Ledger.Client.Parity.Tests.GrpcLedgerAdminParityTests.${PARITY_FACT}" \
            --filter-method "Canton.Ledger.Client.Parity.Tests.RestLedgerAdminParityTests.${PARITY_FACT}" \
            --minimum-expected-tests 2 \
            --output Detailed

      - name: Memory after tests
        if: always()
        run: |
          set -euo pipefail
          free -m
          docker stats --no-stream || true
          {
            echo "## Multi-synchronizer lane memory"
            if [ -s "${MEMORY_SAMPLES}" ]; then
              sort -k2 -n -r "${MEMORY_SAMPLES}" | head -1 | awk '{print "Peak used: " $2 " MiB, available at that sample: " $3 " MiB"}'
              sort -k3 -n "${MEMORY_SAMPLES}" | head -1 | awk '{print "Lowest available: " $3 " MiB"}'
            fi
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Capture LocalNet state on failure
        if: failure()
        working-directory: canton-localnet
        run: |
          set -euo pipefail
          free -m > /tmp/free.txt 2>&1 || true
          docker stats --no-stream > /tmp/docker-stats.txt 2>&1 || true
          make status > /tmp/localnet-status.txt 2>&1 || true
          timeout 30 make logs > /tmp/localnet-logs.txt 2>&1 || true
          docker ps -a > /tmp/docker-ps.txt 2>&1 || true
          cp "${MEMORY_SAMPLES}" /tmp/memory-samples.txt || true
          dmesg 2>/dev/null | grep -i "out of memory\|oom" > /tmp/oom.txt || true

      - name: Upload LocalNet diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-multisync-diagnostics
          path: |
            /tmp/free.txt
            /tmp/docker-stats.txt
            /tmp/localnet-status.txt
            /tmp/localnet-logs.txt
            /tmp/docker-ps.txt
            /tmp/memory-samples.txt
            /tmp/oom.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down LocalNet
        if: always()
        working-directory: canton-localnet
        run: |
          set -euo pipefail
          "${LOCALNET_DIR}/canton-localnet" down --volumes || echo "::warning::teardown failed"
