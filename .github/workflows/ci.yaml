name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: write

jobs:
  csharp-ci:
    uses: peacefulstudio/github-actions/.github/workflows/csharp-ci.yaml@v2
    with:
      artifact-prefix: csharp
      pack: true
      pack-project: Daml.Codegen.CSharp.slnx
      build-matrix: >-
        [{"name":"ubuntu-amd64","runner":"ubuntu-latest","coverage":true},
         {"name":"ubuntu-arm64","runner":"ubuntu-24.04-arm","coverage":false},
         {"name":"windows-amd64","runner":"windows-latest","coverage":false},
         {"name":"windows-arm64","runner":"windows-11-arm","coverage":false},
         {"name":"macos-arm64","runner":"macos-latest","coverage":false},
         {"name":"macos-amd64","runner":"macos-15-intel","coverage":false}]

  packed-set:
    needs: csharp-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json
      - name: Download the packed nupkgs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg
          path: output/nuget
      - name: Verify the packed set and its dependency-first push order
        run: dotnet run scripts/order-nuget-push.cs -- output/nuget

  release-script-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Self-test the source bundle download check
        run: .github/scripts/select-dars.test.sh
      - name: Self-test the Daml SDK component resolution
        run: .github/scripts/resolve-sdk-components.test.sh
      - name: Self-test the dpm-codegen-cs digest pin
        run: .github/scripts/resolve-codegen-cs-digest.test.sh
      - name: Self-test the local feed seeding and core package assertion
        run: .github/scripts/seed-local-feed.test.sh
      - name: Self-test the publish input resolution and runtime version normalization check
        run: .github/scripts/resolve-inputs.test.sh
      - name: Self-test the registry client pack version
        run: .github/scripts/pack-registry-client.test.sh

  intermediate-oracle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup sbt
        uses: sbt/setup-sbt@af116cce31c00823d3903ce687f9cda3a4f19f1b # v1.2.1
      - name: Assemble the helper jar
        working-directory: jvm-helper
        run: sbt 'clean; assembly'
      - name: Assert richtypes.dar full-decode matches the determinism oracle
        run: .github/scripts/check-intermediate-oracle.sh jvm-helper/target/scala-2.13/daml-dar-to-proto.jar

  net10-runtime-tests:
    name: Library tests on the .NET 10 runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SDK_TEST_ALL_TARGET_FRAMEWORKS: "true"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK 11 and the .NET 10 runtime
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            11.0.x
            10.0.x

      - name: Require SDK 11 and a .NET 10 runtime
        run: |
          set -euo pipefail
          case "$(dotnet --version)" in
            11.*) ;;
            *) echo "::error::expected SDK 11, got $(dotnet --version)"; exit 1 ;;
          esac
          dotnet --list-runtimes | grep -E '^Microsoft\.NETCore\.App 10\.'

      - name: Build both targets
        run: dotnet build --configuration Release

      - name: Test the net10.0 assemblies without rolling forward onto a newer runtime
        env:
          DOTNET_ROLL_FORWARD: LatestPatch
        run: |
          set -euo pipefail
          ran=0
          for project in tests/*/*.Tests.csproj; do
            [ -d "$(dirname "${project}")/bin/Release/net10.0" ] || continue
            dotnet test --project "${project}" --configuration Release --no-build --framework net10.0 \
              --minimum-expected-tests 1 --filter 'FullyQualifiedName!~IntermediateDarOracleCheckTests'
            ran=$((ran + 1))
          done
          [ "${ran}" -gt 0 ] || { echo "::error::no test project was built for net10.0"; exit 1; }

  net10-consumer-pack:
    name: Pack the libraries with SDK 11
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK 11
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'

      - name: Pack every published package into a local feed
        run: |
          set -euo pipefail
          feed="${RUNNER_TEMP}/net10-consumer-feed"
          mkdir -p "${feed}"
          while IFS= read -r package_id; do
            [ -n "${package_id}" ] || continue
            dotnet pack "src/${package_id}/${package_id}.csproj" --configuration Release \
              --artifacts-path "${RUNNER_TEMP}/net10-consumer-artifacts" --output "${feed}"
          done < scripts/published-package-ids.txt

      - name: Upload the feed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: net10-consumer-feed
          path: ${{ runner.temp }}/net10-consumer-feed
          if-no-files-found: error
          retention-days: 1

  net10-consumer-build:
    name: Consumer build with only the .NET 10 SDK
    needs: net10-consumer-pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Download the feed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: net10-consumer-feed
          path: ${{ runner.temp }}/net10-consumer-feed

      - name: Restore the packed packages into a net10.0 consumer, generate bindings from a DAR, build and run
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/net10-consumer"
          feed="${RUNNER_TEMP}/net10-consumer-feed"
          rm -rf "${work}"
          mkdir -p "${work}"
          cp conformance/richtypes/richtypes.dar "${work}/richtypes.dar"

          cat > "${work}/global.json" <<'EOF'
          { "sdk": { "version": "10.0.100", "rollForward": "latestFeature" } }
          EOF
          cat > "${work}/nuget.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="feed" value="${feed}" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="feed">
                <package pattern="Daml.*" />
                <package pattern="Canton.*" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF

          cd "${work}"
          case "$(dotnet --version)" in
            10.*) ;;
            *) echo "::error::expected SDK 10, got $(dotnet --version)"; exit 1 ;;
          esac
          if dotnet --list-sdks | grep -q '^11\.'; then
            echo "::error::an SDK 11 is installed on this runner"
            exit 1
          fi

          umbrella="$(find "${feed}" -maxdepth 1 -name 'Daml.Codegen.CSharp.MSBuild.*.nupkg' -print -quit)"
          version="$(basename "${umbrella}" .nupkg)"
          version="${version#Daml.Codegen.CSharp.MSBuild.}"

          cat > Consumer.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <DamlCodegenMode>Standalone</DamlCodegenMode>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Daml.Codegen.CSharp.MSBuild" Version="${version}" PrivateAssets="all" />
              <PackageReference Include="Daml.Runtime" Version="${version}" />
              <PackageReference Include="Daml.Ledger.Abstractions" Version="${version}" />
              <DamlArchive Include="richtypes.dar" />
            </ItemGroup>
          </Project>
          EOF
          cat > Program.cs <<'EOF'
          using System.Reflection;
          using System.Runtime.InteropServices;

          var generated = typeof(Program).Assembly.GetTypes().Count(type => type.Namespace?.StartsWith("RichTypes", StringComparison.Ordinal) == true);
          var runtime = RuntimeInformation.FrameworkDescription;
          Console.WriteLine($"{runtime} generated={generated}");
          return generated > 0 && runtime.StartsWith(".NET 10.", StringComparison.Ordinal) ? 0 : 1;
          EOF

          dotnet restore
          dotnet build --no-restore
          dotnet run --no-build

  badges:
    needs: [csharp-ci, jvm-helper-ci, assemble-badge-data]
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() }}
    permissions:
      contents: write
    uses: peacefulstudio/github-actions/.github/workflows/update-badges.yaml@v2
    with:
      coverage-data: >-
        [{"slug":"csharp","label":"coverage (C#)","percent":"${{ needs.csharp-ci.outputs.coverage }}"},
         {"slug":"scala","label":"coverage (Scala)","percent":"${{ needs.jvm-helper-ci.outputs.coverage }}"}]
      matrix-data: ${{ needs.assemble-badge-data.outputs.matrix-data }}

  jvm-helper-ci:
    uses: peacefulstudio/github-actions/.github/workflows/scala-ci.yaml@v2
    with:
      working-directory: jvm-helper
      artifact-prefix: scala
      # No windows-arm64 shard: Maven Central publishes no windows-aarch_64 protoc
      # binary at any version, so sbt-protoc cannot resolve a compiler there.
      build-matrix: >-
        [{"name":"ubuntu-amd64","runner":"ubuntu-latest","coverage":true},
         {"name":"ubuntu-arm64","runner":"ubuntu-24.04-arm","coverage":false},
         {"name":"windows-amd64","runner":"windows-latest","coverage":false},
         {"name":"macos-arm64","runner":"macos-latest","coverage":false},
         {"name":"macos-amd64","runner":"macos-15-intel","coverage":false}]

  assemble-badge-data:
    needs: [csharp-ci, jvm-helper-ci]
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      matrix-data: ${{ steps.merge.outputs.matrix-data }}
    steps:
      - name: Merge matrix-status by language
        id: merge
        env:
          CSHARP_STATUS: ${{ needs.csharp-ci.outputs.matrix-status }}
          SCALA_STATUS: ${{ needs.jvm-helper-ci.outputs.matrix-status }}
        run: |
          set -euo pipefail
          csharp="$(jq -c '[.[] + {lang:"csharp"}]' <<<"${CSHARP_STATUS:-[]}")"
          scala="$(jq -c '[.[] + {lang:"scala"}]' <<<"${SCALA_STATUS:-[]}")"
          merged="$(jq -cn --argjson a "$csharp" --argjson b "$scala" '$a + $b')"
          echo "matrix-data=$merged" >> "$GITHUB_OUTPUT"