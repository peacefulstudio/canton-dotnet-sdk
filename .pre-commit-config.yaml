repos:
  - repo: local
    hooks:
      - id: license-headers
        name: SPDX license headers
        entry: scripts/check-license-headers.sh
        language: script
        pass_filenames: false
        files: ^(src|tests|jvm-helper|samples|scripts|conformance|proto|benchmarks|\.github/scripts|CONTEXT\.md|Directory\.Build\.props|coverage\.settings\.xml|\.editorconfig|\.pre-commit-config\.yaml)(/|$)
